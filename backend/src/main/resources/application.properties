spring.application.name=yummiee-backend
server.port=8080

# SQLite Datasource Configuration
spring.datasource.url=jdbc:sqlite:yummiee.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clerk Auth Configuration
clerk.jwt.secret=mock-clerk-secret-key-for-dev-and-testing-minimum-256-bits-long
